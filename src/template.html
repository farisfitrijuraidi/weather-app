<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatheria</title>
</head>
<body>
    <div class="main-container">
        <form id="weather-form">
            <div class="input-container">
                <label>
                    <input type="text" id="text" name="text" maxlength="100" placeholder="Type the location here..." pattern="^[a-zA-Z\s]+$" required>
                </label>
                <button id="submit" class="submit">Submit</button>
            </div>
        </form>
        <div class="weather-data">
            <span class="weather-data-text"></span>
        </div>
        <div class="loading">
            <span class="loading-text"></span>
            <img src="./assets/spinner.svg" alt="Loading..." class="spinner-icon">
        </div>
        <div class="container"></div>
    </div>
</body>
</html>
