<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatheria</title>
</head>
<body>
    <form>
        <div>
            <label>
                <input type="text" id="text" name="text" placeholder="Type the location here...">
            </label>
            <button id="submit">Submit</button>
        </div>
    </form>
    <span class="user_location"></span>
    <span class="description"></span>
    <span class="temperature"></span>
    <span class="feelsLike"></span>
    <span class="humidity"></span>
    <span class="uvindex"></span>
    <span class="precipitation"></span>
    <span class="weather-data"></span>
</body>
</html>
